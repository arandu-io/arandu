name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # go.mod carries the minimum version, and setup-go would pin exactly
          # that -- which means CI runs on a Go with known, already fixed
          # vulnerabilities. This takes the newest patch of the same line.
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # These tests need no database: database/sql connects lazily, so the wiring,
      # the pipeline and every route are exercised without a server.
      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o /tmp/app ./cmd/app

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
