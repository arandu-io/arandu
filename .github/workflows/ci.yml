name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The session and the rate limit are proved by running two instances over one
    # store and showing they agree. That proof needs a real RESP server: a fake
    # inside the process would demonstrate the opposite of what is being claimed.
    #
    # Without this block the tests that carry the proof call t.Skip, because
    # ubuntu-latest ships no redis-server -- and a proof that skips is worse than
    # one that fails, since the run stays green while proving nothing.
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.26"), and setup-go installs exactly that -- 1.26.0, whose
          # standard library carries vulnerabilities fixed in later patch
          # releases. govulncheck below is right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against. The minimum in go.mod stays where it is.
          go-version: stable

      # The views are compiled here, not committed.
      #
      # `aru view:build` turns every .kyse.go into the Go beside it, and that
      # output is build output, and .gitignore keeps it out of the tree. Which
      # means this
      # step is not a convenience -- without it nothing below compiles, and the
      # failure is `undefined: renderHome` rather than anything about views.
      - name: build the views
        run: |
          go install github.com/arandu-io/aru@latest
          "$(go env GOPATH)/bin/aru" view:build

      - name: gofmt
        # `gofmt -l .` skips nothing, and two things in this repository are not
        # valid Go on purpose:
        #
        #   testdata/    fixtures the doctor has to reject, including a file
        #                that does not parse -- that one is the test
        #   *.kyse.go    kyse templates; the compiler excludes them through the
        #                build tag, but gofmt ignores build tags
        #
        # `go build`, `go vet` and `go test` skip both on their own.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The layout of the test tree, checked by the thing that can check it.
      # The first of its four rules is the one that costs the most to get wrong:
      # a file named CacheTest.go or cache_Test.go compiles as ordinary code and
      # none of its tests run, with no error and no warning. The step below goes
      # green and the suite is off.
      #
      # It sits after the view build, not before, and that is the one ordering
      # this step has. Its fourth check asks `go list` what the production
      # packages import, and until `aru view:build` has run there is no
      # storage/framework/views for them to import -- the guard would report a
      # module it could not read, which is honest and useless.
      - name: test layout
        run: bash tests/test-layout-guard.sh

      # These tests need no database: database/sql connects lazily, so the wiring,
      # the pipeline and every route are exercised without a server.
      #
      # They do need the RESP server declared above, and only for the two tests
      # that prove a session and a rate limit are shared across instances. Those
      # skip without it rather than fail, so REDIS_ADDRESS is what makes them run.
      - name: test
        run: go test -race ./...
        env:
          REDIS_ADDRESS: 127.0.0.1:6379

      - name: build
        run: go build -o /tmp/app .

      # The architecture rules, checked. Without this step "the architecture is
      # mandatory" holds only where the type system reaches -- it cannot see a
      # handler at the database, a tenant read from a header, or a Grant that
      # arrives and is never checked. Those are errors, and an error fails the
      # build.
      #
      # Not --strict, and that is deliberate. `aru new` copies this workflow into
      # every project it creates, so this file is the CI of somebody who has
      # written no code yet. `aru make:module` writes a policy that denies every
      # action -- on purpose, that is the thesis -- and `policy-never-opened`
      # then fires on the file the generator itself just wrote. Under --strict
      # the first push of a brand new project is red for something the developer
      # did not do, and a check that is red on day zero is a check people learn
      # to ignore.
      #
      # Nothing was loosened: the policy still starts denying, the warning is
      # still printed with the file and the line, and opening it is still the
      # next thing to do. What changed is that a to-do is reported as a to-do.
      - name: doctor
        run: |
          go install github.com/arandu-io/aru@latest
          aru doctor

      # The image, for real. Doc 17 promises one artifact that every platform
      # consumes, and a Dockerfile that stopped building is found on the day
      # somebody deploys -- which is the worst day to find it.
      - name: the image builds and the binary starts
        run: |
          docker build -t arandu-ci --build-arg VERSION=ci .
          docker run --rm \
            -e APP_ENV=dev \
            -e APP_KEY=0123456789abcdef0123456789abcdef \
            -e DATABASE_URL=sqlite:///tmp/ci.sqlite \
            -e ARANDU_TENANT_ID=11111111-1111-4111-8111-111111111111 \
            arandu-ci migrate

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
