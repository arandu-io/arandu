name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # One server: the Postgres the feature, conformance and end-to-end tests
    # run on. tests.Serve gives every test a database of its own, copied from a
    # template migrated once per package, so the tests prove the engine a
    # deployment runs rather than the SQLite a fresh clone falls back to. CI is
    # set on every runner, and with it a test that finds no database fails
    # instead of skipping: a skipped suite reports green and proves nothing.
    #
    # No Redis. The project links no RESP client, so there is nothing in this
    # binary to point at one: the tests check the wiring behind the Redis
    # connector with a connector of their own, and what a real server does
    # under it -- two processes sharing a session, a rate limit counted across
    # replicas -- is proved where the connector is, in
    # github.com/arandu-io/hesape/redis, against a real server. A project that
    # links the connector and wants that proof in its own CI adds a redis
    # service here and runs the connector's tests with REDIS_ADDRESS set.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arandu
          POSTGRES_PASSWORD: arandu
          POSTGRES_DB: arandu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arandu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      ARANDU_TEST_DATABASE_URL: postgres://arandu:arandu@127.0.0.1:5432/arandu?sslmode=disable

    # Each action is pinned to a commit, with its release in the comment. A tag
    # is a pointer its owner can move, and a moved tag runs somebody else's code
    # with this repository's token; a commit cannot be moved. Dependabot bumps
    # the commit and the comment together.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.26"), and setup-go installs exactly that -- 1.26.0, whose
          # standard library carries vulnerabilities fixed in later patch
          # releases. govulncheck below is right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against. The minimum in go.mod stays where it is.
          go-version: stable

      # The aru the Dockerfile builds the image with, read from its
      # ARU_VERSION, so the CI and the image cannot disagree about which release
      # compiled the views or checked the architecture. @latest would make the
      # same commit pass or fail depending on the day it was built.
      - name: install aru
        run: |
          aru_version="$(sed -n 's/^ARG ARU_VERSION=//p' Dockerfile)"
          if [ -z "$aru_version" ]; then
            echo "the Dockerfile declares no ARG ARU_VERSION default"
            exit 1
          fi
          go install "github.com/arandu-io/aru@${aru_version}"

      # The views are compiled here, not committed.
      #
      # `aru view:build` turns every .kyse.go into the Go beside it, and that
      # output is build output, and .gitignore keeps it out of the tree. Which
      # means this
      # step is not a convenience -- without it nothing below compiles, and the
      # failure is `undefined: renderHome` rather than anything about views.
      - name: build the views
        run: |
          "$(go env GOPATH)/bin/aru" view:build

      - name: gofmt
        # `gofmt -l .` skips nothing, and two things in this repository are not
        # valid Go on purpose:
        #
        #   testdata/    fixtures the doctor has to reject, including a file
        #                that does not parse -- that one is the test
        #   *.kyse.go    kyse templates; the compiler excludes them through the
        #                build tag, but gofmt ignores build tags
        #
        # `go build`, `go vet` and `go test` skip both on their own.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Twice: once as go test builds the tree, and once with the e2e tag, so a
      # journey that stopped compiling is caught here and not only by the job
      # that drives a browser.
      - name: vet
        run: |
          go vet ./...
          go vet -tags e2e ./...

      # The layout of the test tree, checked by the thing that can check it.
      # The first of its four rules is the one that costs the most to get wrong:
      # a file named CacheTest.go or cache_Test.go compiles as ordinary code and
      # none of its tests run, with no error and no warning. The step below goes
      # green and the suite is off.
      #
      # It sits after the view build, not before, and that is the one ordering
      # this step has. Its fourth check asks `go list` what the production
      # packages import, and until `aru view:build` has run there is no
      # storage/framework/views for them to import -- the guard would report a
      # module it could not read, which is honest and useless.
      - name: test layout
        run: bash tests/test-layout-guard.sh

      # Unit, Feature and Conformance. The feature and conformance tests run on
      # the Postgres above, a database per test; the unit tests open none. A
      # test that declares itself SQLite-safe -- the wiring of a setting, a
      # command against a file -- still runs on a temporary SQLite file.
      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o /tmp/app .

      # The architecture rules, checked. Without this step "the architecture is
      # mandatory" holds only where the type system reaches -- it cannot see a
      # handler at the database, a tenant read from a header, or a Grant that
      # arrives and is never checked. Those are errors, and an error fails the
      # build.
      #
      # Not --strict, and that is deliberate. `aru new` copies this workflow into
      # every project it creates, so this file is the CI of somebody who has
      # written no code yet. `aru make:module` writes a policy that denies every
      # action -- on purpose, that is the thesis -- and `policy-never-opened`
      # then fires on the file the generator itself just wrote. Under --strict
      # the first push of a brand new project is red for something the developer
      # did not do, and a check that is red on day zero is a check people learn
      # to ignore.
      #
      # Nothing was loosened: the policy still starts denying, the warning is
      # still printed with the file and the line, and opening it is still the
      # next thing to do. What changed is that a to-do is reported as a to-do.
      - name: doctor
        run: aru doctor

      # The image, for real. Doc 17 promises one artifact that every platform
      # consumes, and a Dockerfile that stopped building is found on the day
      # somebody deploys -- which is the worst day to find it.
      #
      # The first run names no APP_ENV, so it boots as the image does on a
      # platform that sets nothing: production, which registers no debug page.
      # A route list that shows /_arandu/debug is an image that would serve
      # every recent query and its arguments to whoever asks.
      #
      # The second run says dev, and means it. `migrate` outside dev takes a
      # lock every replica sees, and this run has no such store -- in staging
      # or production it refuses, which is right for a rollout and is not what
      # this step is here to check.
      - name: the image builds and the binary starts
        run: |
          docker build -t arandu-ci --build-arg VERSION=ci .
          # Production refuses the log mailer, and this run sends nothing.
          routes="$(docker run --rm \
            -e MAIL_URL=array:// \
            -e APP_KEY=0123456789abcdef0123456789abcdef \
            -e DATABASE_URL=sqlite:///tmp/ci.sqlite \
            -e ARANDU_TENANT_ID=11111111-1111-4111-8111-111111111111 \
            arandu-ci routes)"
          if printf '%s\n' "$routes" | grep -q '/_arandu/debug'; then
            echo "the image boots as dev when APP_ENV is unset: /_arandu/debug is registered"
            exit 1
          fi
          docker run --rm \
            -e APP_ENV=dev \
            -e APP_KEY=0123456789abcdef0123456789abcdef \
            -e DATABASE_URL=sqlite:///tmp/ci.sqlite \
            -e ARANDU_TENANT_ID=11111111-1111-4111-8111-111111111111 \
            arandu-ci migrate

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # The sign-in screens' matrix. The screens are published into
  # app/Http/Controllers/Auth by `ui auth` and are not in this skeleton until
  # somebody runs it, so the suite sits behind the authui tag and go test
  # ./... never compiles it. This job publishes them into its own checkout,
  # the way a project does once, and runs the kit against them -- on Postgres,
  # like the rest -- so the screens a project installs are proved against the
  # account rules this release ships.
  authui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arandu
          POSTGRES_PASSWORD: arandu
          POSTGRES_DB: arandu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arandu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ARANDU_TEST_DATABASE_URL: postgres://arandu:arandu@127.0.0.1:5432/arandu?sslmode=disable
      # The installer's release, pinned like aru: @latest would make the same
      # commit pass or fail depending on the day it ran.
      UI_VERSION: v0.28.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: install aru
        run: |
          aru_version="$(sed -n 's/^ARG ARU_VERSION=//p' Dockerfile)"
          if [ -z "$aru_version" ]; then
            echo "the Dockerfile declares no ARG ARU_VERSION default"
            exit 1
          fi
          go install "github.com/arandu-io/aru@${aru_version}"

      - name: publish the sign-in screens
        run: go run "github.com/arandu-io/ui@${UI_VERSION}" auth

      - name: build the views
        run: |
          "$(go env GOPATH)/bin/aru" view:build

      - name: the sign-in screens' session matrix
        run: go test -race -tags authui ./tests/Conformance/...

  # The journeys, in Chrome, on Postgres. They carry the e2e build tag, so the
  # test step above does not even compile them; this job is the one that runs
  # them. The runner ships Chrome, and the native driver starts it over its
  # debugging pipe with nothing else installed.
  #
  # No retry. A journey that fails once is a failure, and the trace -- every
  # step with a screenshot and the DOM after it, the network, the console and
  # what failed -- is uploaded so the failure can be read without running it
  # again.
  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arandu
          POSTGRES_PASSWORD: arandu
          POSTGRES_DB: arandu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arandu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ARANDU_TEST_DATABASE_URL: postgres://arandu:arandu@127.0.0.1:5432/arandu?sslmode=disable
      ARANDU_E2E_TRACE_DIR: ${{ runner.temp }}/e2e-traces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: install aru
        run: |
          aru_version="$(sed -n 's/^ARG ARU_VERSION=//p' Dockerfile)"
          if [ -z "$aru_version" ]; then
            echo "the Dockerfile declares no ARG ARU_VERSION default"
            exit 1
          fi
          go install "github.com/arandu-io/aru@${aru_version}"

      - name: build the views
        run: |
          "$(go env GOPATH)/bin/aru" view:build

      - name: journeys
        run: go test -count=1 -tags e2e ./tests/E2E/...

      - name: upload the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: ${{ runner.temp }}/e2e-traces
          if-no-files-found: ignore
