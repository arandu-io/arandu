name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # arandu-io/framework is private until the repositories are made public.
      # GOPRIVATE keeps the module out of the public proxy and checksum database,
      # and the git rewrite below authenticates the fetch with the workflow's own
      # token -- which works because the framework repository allows Actions
      # access from the organization. No personal token, no stored secret.
      #
      # Both lines become unnecessary, and harmless, once the repositories are
      # public.
      GOPRIVATE: github.com/arandu-io

    steps:
      - uses: actions/checkout@v4

      - name: authenticate module fetches
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # These run against a real database, because SQLite is a file: migrate,
      # seed, sign in. No service container needed.
      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o /tmp/app ./cmd/app
