name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.25"), and setup-go installs exactly that -- 1.25.0, whose
          # standard library carries vulnerabilities fixed in 1.25.11 and later.
          # govulncheck below is right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against. The minimum in go.mod stays where it is.
          go-version: stable

      - name: gofmt
        # `gofmt -l .` nao pula nada, e duas coisas neste repositorio nao sao
        # Go valido de proposito:
        #
        #   testdata/    fixtures que o doctor tem que recusar, incluindo um
        #                arquivo que nao parseia — e o teste
        #   *.kyse.go    template do kyse; o compilador o exclui pela tag de
        #                build, mas o gofmt ignora build tag
        #
        # `go build`, `go vet` e `go test` pulam os dois sozinhos.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # These tests need no database: database/sql connects lazily, so the wiring,
      # the pipeline and every route are exercised without a server.
      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o /tmp/app .

      # The architecture rules, checked. Without this step "the architecture is
      # mandatory" holds only where the type system reaches -- it cannot see a
      # policy nobody opened, a handler at the database, or a tenant from a
      # header. --strict makes warnings fail too, which is the right setting for
      # the skeleton: it ships as an example.
      - name: doctor
        run: |
          go install github.com/arandu-io/aru@latest
          aru doctor --strict

      # The image, for real. Doc 17 promises one artifact that every platform
      # consumes, and a Dockerfile that stopped building is found on the day
      # somebody deploys -- which is the worst day to find it.
      - name: the image builds and the binary starts
        run: |
          docker build -t arandu-ci --build-arg VERSION=ci .
          docker run --rm \
            -e APP_ENV=dev \
            -e APP_KEY=0123456789abcdef0123456789abcdef \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/ci.sqlite \
            -e ARANDU_TENANT_ID=11111111-1111-4111-8111-111111111111 \
            arandu-ci migrate

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
