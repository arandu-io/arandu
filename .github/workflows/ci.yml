name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # arandu-io/framework is private until the repositories are made public.
      # GOPRIVATE keeps the module out of the public proxy and checksum database,
      # and the git rewrite below is what lets the fetch authenticate. Both lines
      # become unnecessary, and harmless, once the framework is public.
      GOPRIVATE: github.com/arandu-io

    steps:
      - uses: actions/checkout@v4

      - name: authenticate module fetches
        run: |
          git config --global url."https://x-access-token:${FRAMEWORK_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          FRAMEWORK_TOKEN: ${{ secrets.FRAMEWORK_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # These tests need no database: database/sql connects lazily, so the wiring,
      # the pipeline and every route are exercised without a server.
      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o /tmp/app ./cmd/app
