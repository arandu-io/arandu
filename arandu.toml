# The build tools this project uses, pinned.
#
# Pinned rather than tracked: a build that silently picks up a new major of
# Tailwind is a build that breaks on someone else's machine and not on yours.
# `aru view:build` downloads these on first use and caches them in ~/.arandu/bin,
# the same way Go handles its own toolchain.
#
# Neither is Node. templ is a Go binary; tailwindcss is the standalone CLI that
# Tailwind publishes for projects that do not want a package manager. There is no
# package.json here and there never will be -- see doc 14 and RULE 13.

[tools]
templ = "v0.3.1020"
tailwindcss = "v4.3.3"
