# Postgres and Redis for local development.
#
# This is a file, not a product. `go run` already runs the application, so the
# only thing missing locally is the data stores.
#
# A new project needs neither: it runs on SQLite with its cache and sessions in
# the process, and its binary links no client for these two. Starting them is
# half of using them; the other half is linking each client, a `go get` and a
# blank import in bootstrap/app.go beside the SQLite one:
#
#   postgres  go get github.com/arandu-io/hesape/database/connectors/pgx
#             _ "github.com/arandu-io/hesape/database/connectors/pgx"
#             DATABASE_URL=postgres://arandu:arandu@127.0.0.1:5432/arandu
#
#   redis     go get github.com/arandu-io/hesape/redis
#             _ "github.com/arandu-io/hesape/redis"
#             CACHE_STORE=redis and/or SESSION_DRIVER=redis, REDIS_URL=redis://127.0.0.1:6379
#
# A setting that names one of them before its import is in stops the boot and
# prints both lines.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arandu
      POSTGRES_PASSWORD: arandu
      POSTGRES_DB: arandu
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arandu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  redis:
