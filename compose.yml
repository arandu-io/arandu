# Postgres and Redis for local development.
#
# This is a file, not a product. Go needs no equivalent of Laravel Sail: `go run`
# already runs the application, so the only thing missing locally is the data
# stores. See 06-escopo.md.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arandu
      POSTGRES_PASSWORD: arandu
      POSTGRES_DB: arandu
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arandu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  redis:
